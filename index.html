<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS System Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #030712; color: #00f0ff; font-family: monospace; overflow-x: hidden; }
        .arc-reactor {
            border: 4px solid #00f0ff;
            box-shadow: 0 0 25px #00f0ff, inset 0 0 25px #00f0ff;
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .glow-text { text-shadow: 0 0 10px #00f0ff; }
        .glass-panel { background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.3); }
    </style>
</head>
<body class="p-4 flex flex-col justify-between min-h-screen">

    <!-- ÜST BİLGİ VE PROFİL PANELİ -->
    <header class="flex justify-between items-center glass-panel p-4 rounded-xl">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-cyan-400 rounded-full animate-ping"></div>
            <h1 class="text-xl font-bold tracking-widest glow-text">J.A.R.V.I.S. // CLOUD</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleApiKeyModal()" class="px-3 py-1 bg-cyan-950 border border-cyan-500 text-xs rounded hover:bg-cyan-900 transition">
                <i class="fas fa-key mr-1"></i> API KEY
            </button>
            <div class="text-xs border border-cyan-800 px-2 py-1 rounded bg-black/40">
                PROFİL: <span id="userProfile" class="text-white">YÖNETİCİ</span>
            </div>
        </div>
    </header>

    <!-- ORTA PANEL: ARC REAKTÖR VE KAMERA HAREKET SİMÜLASYONU -->
    <main class="my-auto flex flex-col items-center justify-center relative my-8">
        
        <!-- Arc Reaktörü Animasyonu -->
        <div id="arcCore" class="arc-reactor w-48 h-48 sm:w-64 sm:h-64 rounded-full flex items-center justify-center relative cursor-pointer" onclick="triggerSpeechInput()">
            <div class="w-32 h-32 border-2 border-cyan-300 rounded-full flex items-center justify-center">
                <i class="fas fa-microchip text-4xl text-cyan-400 animate-pulse"></i>
            </div>
        </div>

        <!-- Kamera ve El Hareketi Tespiti Paneli -->
        <div id="cameraPreviewContainer" class="hidden absolute top-0 w-full max-w-md h-64 glass-panel rounded-xl flex flex-col items-center justify-center p-2 z-20">
            <video id="webcam" autoplay playsinline class="w-full h-40 object-cover rounded border border-cyan-500/40"></video>
            <div class="mt-2 text-xs flex justify-between w-full px-4">
                <span class="text-green-400 animate-pulse"><i class="fas fa-hand-paper mr-1"></i> El Hareketi Algılanıyor...</span>
                <button onclick="closeCamera()" class="text-red-400 border border-red-500/40 px-2 py-0.5 rounded">Kapat</button>
            </div>
        </div>

        <p id="statusText" class="mt-6 text-sm tracking-wider text-cyan-300/80 glow-text text-center">
            [SİSTEM HAZIR] KOMUT BEKLENİYOR...
        </p>
    </main>

    <!-- ALT PANEL: KONTROLLER VE LOG TERMINALİ -->
    <footer class="space-y-3">
        <!-- Terminal Log Ekranı -->
        <div id="terminalLog" class="glass-panel p-3 rounded-xl h-24 overflow-y-auto text-xs space-y-1 font-mono border-cyan-900">
            <div class="text-cyan-600">> JARVIS v4.0 Cloud Akıllı Asistan başlatıldı.</div>
            <div class="text-cyan-600">> Bağlantı: Güvenli Bulut Sunucu (OK)</div>
        </div>

        <!-- Komut Girdi Butonları -->
        <div class="flex items-center space-x-2">
            <button onclick="startGestureDetection()" class="glass-panel px-4 py-3 rounded-xl hover:bg-cyan-950/50 flex items-center justify-center border-cyan-500">
                <i class="fas fa-camera text-cyan-400"></i>
            </button>
            <input type="text" id="commandInput" placeholder="Jarvis'e emredin..." class="w-full glass-panel px-4 py-3 rounded-xl text-cyan-300 focus:outline-none border-cyan-500/50 placeholder-cyan-800 text-sm" onkeypress="if(event.key==='Enter') sendCommand()">
            <button onclick="sendCommand()" class="glass-panel px-5 py-3 rounded-xl bg-cyan-950 border border-cyan-400 text-cyan-300 font-bold hover:bg-cyan-900">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <!-- API KEY MODAL -->
    <div id="apiModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="glass-panel p-6 rounded-2xl max-w-sm w-full space-y-4">
            <h2 class="text-md font-bold glow-text">GEMINI API KEY BAĞLANTISI</h2>
            <p class="text-xs text-cyan-400/70">Google AI Studio'dan aldığınız API Key'i buraya yapıştırın:</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-black/60 border border-cyan-500/40 p-2 text-xs rounded text-cyan-200">
            <div class="flex justify-end space-x-2">
                <button onclick="toggleApiKeyModal()" class="px-3 py-1 text-xs border border-red-500/50 text-red-400 rounded">İptal</button>
                <button onclick="saveApiKey()" class="px-3 py-1 text-xs bg-cyan-900 border border-cyan-400 text-white rounded">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('jarvis_gemini_key') || '';

        function log(msg) {
            const terminal = document.getElementById('terminalLog');
            terminal.innerHTML += `<div>> ${msg}</div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                utterance.pitch = 0.7; // Sert / Tok Ses Tonu
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function sendCommand() {
            const input = document.getElementById('commandInput');
            const text = input.value.trim();
            if (!text) return;

            log(`KOMUT: ${text}`);
            input.value = '';
            document.getElementById('statusText').innerText = '[İŞLENİYOR...]';

            if (!apiKey) {
                log('HATA: Gemini API Key tanımlı değil!');
                speak('Efendim, lütfen önce API anahtarınızı tanımlayın.');
                document.getElementById('statusText').innerText = '[HATA: API KEY EKSİK]';
                return;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Sen Jarvis adında fütüristik, yardımsever, otoriter ve karizmatik bir kişisel yapay zeka asistanısın. Kısa ve net Türkçe yanıt ver. Kullanıcı komutu: ${text}` }] }]
                    })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;

                log(`JARVIS: ${reply}`);
                document.getElementById('statusText').innerText = reply;
                speak(reply);
            } catch (err) {
                log(`HATA: ${err.message}`);
                speak('Sunucu bağlantısında bir sorun oluştu efendim.');
            }
        }

        function startGestureDetection() {
            const container = document.getElementById('cameraPreviewContainer');
            container.classList.remove('hidden');
            log('Kamera açıldı: El hareketi algılama aktif.');
            
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    document.getElementById('webcam').srcObject = stream;
                    setTimeout(() => {
                        log('SİMÜLASYON: El ile veri tutma hareketi algılandı!');
                        log('BULUT AKTARIMI: Nesne / Veri hedef cihaza iletiliyor...');
                        speak('El hareketiniz algılandı efendim. Veri diğer cihazınıza aktarılıyor.');
                    }, 3000);
                })
                .catch(err => log('Kamera erişim hatası: ' + err));
        }

        function closeCamera() {
            const video = document.getElementById('webcam');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            document.getElementById('cameraPreviewContainer').classList.add('hidden');
            log('Kamera kapatıldı.');
        }

        function toggleApiKeyModal() {
            document.getElementById('apiModal').classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('jarvis_gemini_key', key);
                apiKey = key;
                log('API Key başarıyla kaydedildi.');
                speak('API Bağlantısı sağlandı efendim. Tüm sistemler aktif.');
                toggleApiKeyModal();
            }
        }
    </script>
</body>
</html>
